<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Around Town – Unit 8 Lesson 1</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{margin:0;height:100%;display:flex;overflow:hidden;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:#27264a;background:radial-gradient(circle at 8% 5%,#fff4a8 0,transparent 30%),radial-gradient(circle at 95% 90%,#ffd1ea 0,transparent 30%),linear-gradient(#aee6ff,#d6ffc9)}
.sb{flex:0 0 310px;min-height:0;display:flex;flex-direction:column;gap:12px;overflow-y:scroll;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;scrollbar-width:thin;padding:16px 14px calc(120px + env(safe-area-inset-bottom,0px)) calc(14px + env(safe-area-inset-left,0px));background:linear-gradient(#8a5cf6,#ff4f9a 60%,#ff8a2b);color:#fff}
.sb>*{flex-shrink:0}
.sb h1{margin:0;font-size:32px;line-height:1.1;text-shadow:2px 2px 0 #0003}.sb h1 small{display:block;margin-top:4px;font-size:18px;opacity:.95}
.sb .home{background:#fff;color:#7a2be2}
.players{display:flex;flex-direction:column;gap:10px}
.pl{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:#fff;color:#27264a;border:4px solid var(--c);border-radius:22px;padding:8px 10px;font-weight:800;transition:.2s}
.pl.on{background:var(--c);color:#fff;transform:scale(1.03)}
.pl input{flex:1 1 100%;min-width:0;min-height:48px;border:0;border-radius:14px;box-shadow:inset 0 0 0 2px #0002;background:none;padding:0 10px;font:inherit;font-size:22px;color:inherit;outline:0}
.pl button{flex:1;min-height:48px;min-width:48px;border:0;border-radius:16px;padding:6px 10px;font:inherit;font-size:17px;background:#e9f7ff;color:#27264a;cursor:pointer}
.pl b{min-width:64px;text-align:center;font-size:22px}
.team{background:#fff3;border-radius:18px;padding:12px;font-weight:900;font-size:20px;text-align:center}
.road{height:36px;border-radius:12px;background:#4a4e69;position:relative;overflow:hidden}
.road:before{content:"";position:absolute;left:0;right:0;top:16px;height:4px;background:repeating-linear-gradient(90deg,#fff 0 28px,transparent 28px 56px)}
.road i{position:absolute;top:2px;font-size:26px;font-style:normal;animation:drive 9s linear infinite}
@keyframes drive{from{left:-60px}to{left:100%}}
main{flex:1 1 auto;min-width:0;min-height:0;overflow-x:hidden;overflow-y:scroll;overscroll-behavior-y:contain;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;padding:18px calc(22px + env(safe-area-inset-right,0px)) calc(240px + env(safe-area-inset-bottom,0px)) 22px}
main>*{max-width:1400px;margin-left:auto;margin-right:auto}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.tile{border:0;border-radius:28px;padding:20px;color:#fff;font:inherit;font-size:26px;font-weight:900;text-align:left;min-height:170px;cursor:pointer;box-shadow:0 8px 0 #0003;transition:transform .15s}
.tile:hover{transform:translateY(-5px) rotate(-1.5deg)}
.tile b{display:block;font-size:52px}.tile small{display:block;margin-top:6px;font-size:15px;font-weight:600}
.panel{background:#fff;border-radius:24px;padding:14px 18px;margin-top:16px;box-shadow:0 6px 0 #0001;font-size:22px;line-height:1.5}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.top h2{margin:0;flex:1;font-size:clamp(24px,3vw,38px);color:#7a2be2}
#cnt{font-weight:900;font-size:26px}
.ins{background:#fff8cc;border:3px dashed #ff8a2b}
.row{display:flex;gap:18px;flex-wrap:wrap;margin-top:16px;align-items:flex-start}
.map{position:relative;flex:1 1 420px;max-width:760px;border:6px solid #fff;border-radius:24px;overflow:hidden;box-shadow:0 8px 0 #0002;line-height:0}
.map img{width:100%;display:block}
.side{flex:1 1 300px}
.hs{position:absolute;width:9%;min-width:48px;min-height:48px;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 3px var(--c);background:#ffffff55;cursor:pointer;padding:0;animation:pulse 1.6s infinite}
.hs.hide{background:none;border-color:transparent;box-shadow:none;animation:none}
.hs.off{pointer-events:none}
.hs.glow{background:#ffcf3399;border-color:#fff;box-shadow:0 0 0 4px #ff5252;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.18)}}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:0;border-radius:18px;min-height:56px;min-width:56px;padding:12px 22px;color:#fff;font:inherit;font-size:22px;font-weight:800;cursor:pointer;box-shadow:0 5px 0 #0003}
.chip:active{transform:translateY(3px);box-shadow:0 2px 0 #0003}.chip:disabled{opacity:.45;cursor:not-allowed}
.big{font-size:clamp(28px,3vw,44px);font-weight:900;margin:6px 0 12px}
.say{background:#fff8cc;border:3px dashed #ff8a2b;border-radius:18px;padding:14px 18px;font-size:30px;font-weight:800;min-height:72px}
.ok{background:#d6ffd9!important;border-color:#3dbb4d}
.bad{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
.msg{font-size:26px;font-weight:800;min-height:30px;text-align:center}
.item{background:#fff;border-radius:16px;padding:10px 14px;margin-top:10px;font-weight:800;border:3px solid #e8d9ff}
.item .chip{min-height:48px;min-width:48px;padding:6px 14px;font-size:20px}
.pop{position:fixed;font-size:32px;pointer-events:none;z-index:9;animation:fly 1.4s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(360deg);opacity:0}}
button,input,[onclick],.hs,.tile,.chip,.pl{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{-webkit-user-select:none;user-select:none}
input{min-height:48px}
@media(max-width:860px){body{flex-direction:column}.sb{flex:0 0 auto;max-height:44%;padding:10px 12px 14px}.sb h1{font-size:26px}.players{flex-direction:row;flex-wrap:wrap}.pl{flex:1 1 220px}.team,.road{display:none}main{padding:14px 12px calc(240px + env(safe-area-inset-bottom,0px))}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<aside class="sb"><h1>🚦 Around Town<small>Unit 8 · Lesson 1</small></h1><button class="chip home" onclick="home()">🏠 Home</button><div class="players" id="pl"></div><div class="team" id="team"></div>
<div class="road"><i>🚗</i><i style="animation-delay:-3s">🚌</i><i style="animation-delay:-6s">🚕</i></div></aside>
<main id="stage"></main>

function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
const chip=(t,c,f)=>`<button class="chip" style="background:${c}" onclick="${f}">${t}</button>`;
const msg=t=>{const m=$('#fb');if(m)m.innerHTML=t};
const bad=(el='#ans')=>{const e=$(el);e.classList.add('bad');setTimeout(()=>e.classList.remove('bad'),450);msg('Try again! 💪')};
const nxt=()=>{cur=(cur+1)%P.length;bar()};

function boom(e,n){for(let i=0;i<n;i++){const s=document.createElement('span');s.className='pop';s.textContent=e;s.style.cssText=`left:${35+Math.random()*30}vw;top:55vh;--dx:${(Math.random()-.5)*70}vw;--dy:${-10-Math.random()*40}vh`;document.body.appendChild(s);setTimeout(()=>s.remove(),1500)}}
function bar(){$('#pl').innerHTML=P.map((p,i)=>`<div class="pl${i==cur?' on':''}" style="--c:${p.c}"><input value="${esc(p.n)}" aria-label="Name" onchange="P[${i}].n=this.value.trim()||'Student ${i+1}';bar()"><button onclick="P[${i}].l^=1;bar()" title="Change level">${p.l?'🚀 Explorer':'🌱 Starter'}</button><b>⭐${p.s}</b></div>`).join('');$('#team').textContent='🌟 Team stars: '+P.reduce((a,p)=>a+p.s,0)}

function shell(t,ins,spots,side){
 stage.scrollTop=0;stage.innerHTML=`<div class="top"><h2>${t}</h2><span id="cnt"></span></div><div class="panel ins">${ins}</div><div class="row">${spots?`<div class="map"><img src="${IMG}" alt="Town map">${spots.map(([i,x,y,c,k])=>`<button class="hs ${k||''}" id="h${i}" style="left:${x/5.92}%;top:${y/5.77}%;--c:${c}" onclick="H('${i}')" aria-label="${i}"></button>`).join('')}</div>`:''}<div class="side">${side}</div></div><p id="fb" class="msg"></p>`}

function home(){H=()=>{};stage.scrollTop=0;stage.innerHTML=`<div class="grid">${T.map(([f,e,t,d,c])=>`<button class="tile" style="background:${c}" onclick="${f}()"><b>${e}</b>${t}<small>${d}</small></button>`).join('')}</div><div class="panel">✏️ <b>Teacher tip:</b> type each student’s name above and tap 🌱 / 🚀 to set their level.<br>🌱 <b>Starter</b> = fewer choices, picture hints, ready-made sentence starts. 🚀 <b>Explorer</b> = more choices, build the whole sentence, type your own street.<br>Students take turns — every ⭐ counts for the team!</div>`}

function fin(f){boom('🎉',30);say('Great job, team!');stage.scrollTop=0;stage.innerHTML=`<div class="panel" style="text-align:center"><div class="big">🏆 Great job, team! 🏆</div><div class="chips" style="justify-content:center">${P.map(p=>`<span class="chip" style="background:${p.c}">${esc(p.n)} ⭐${p.s}</span>`).join('')}</div><p class="big">Everyone is a winner! 🌟</p>${chip('🔁 Play again','#3dbb4d',f+'()')} ${chip('🏠 Home','#6c757d','home()')}</div>`}

 const got=new Set();let done=0;

  say(w[0]);$('#cnt').textContent=`🎧 ${got.size}/${W.length}`;
  if(got.size==W.length&&!done){done=1;P.forEach(p=>p.s++);bar();boom('🎉',24);msg('🏆 You heard every word! +1 ⭐ for everyone!')}};
 window.spoke=()=>{const w=P[cur].n;star();nxt();msg(`Well done, ${esc(w)}! ⭐ Now it’s ${esc(P[cur].n)}’s turn!`)};
 shell('1 · Listen and Say','👆 Tap a circle on the map (or a word). <b>Listen</b>, then <b>say it</b> out loud!',W.map((w,i)=>[i,w[2],w[3],w[4]]),`<div class="say" id="card">👈 Tap the map!</div><div class="chips" style="margin-top:12px">${W.map((w,i)=>chip(w[0],w[4],`H(${i})`)).join('')}</div>`);
 $('#cnt').textContent=`🎧 0/${W.length}`}

// 2 · Ask and Answer
function a2(){
 H=()=>{};const R=sh(Q2);let n=0,a=['',''];
 const opts=(c,k)=>sh([c,...sh([0,1,2,3].filter(i=>i!=c)).slice(0,k-1)]);
 const draw=()=>{const q=R[n],ex=P[cur].l;
  document.querySelectorAll('.hs').forEach(h=>h.classList.remove('glow'));if(!ex)$('#h'+q[4]).classList.add('glow');
  $('#q').innerHTML=`<span style="color:${P[cur].c}">${esc(P[cur].n)}</span>, answer! ❓ Where ${q[1]} ${q[0]}?`;
  $('#ans').textContent=`${a[0]||'…'} in ${a[1]||'…'}.`;
  $('#o1').innerHTML=ex&&!a[0]?['They’re','It’s'].map(t=>chip(t,'#8a5cf6',`pk(0,'${t}')`)).join(''):'';
  $('#o2').innerHTML=a[0]&&!a[1]?opts(q[3],ex?4:2).map(i=>chip(S[i],W[6+i][4],`pk(1,${i})`)).join(''):''};
 const ask=()=>{a=[P[cur].l?'':R[n][2],''];$('#ans').classList.remove('ok');draw();say(`Where ${R[n][1]} ${R[n][0]}?`)};
 window.rq=()=>say(`Where ${R[n][1]} ${R[n][0]}?`);
 window.pk=(s,v)=>{const q=R[n];
  if(s?v!=q[3]:v!=q[2])return bad();
  a[s]=s?S[v]:v;draw();
  if(a[0]&&a[1]){const t=`${a[0]} in ${a[1]}.`;$('#ans').classList.add('ok');say(t);star();msg('✅ Great! Now say it together!');setTimeout(()=>{n++;nxt();n<R.length?ask():fin('a2')},2800)}};
 shell('2 · Ask and Answer','💬 Listen to the question, then answer. Example: <b>Where are the traffic lights? — They’re in Long Street.</b>',Object.keys(O).map(k=>[k,...O[k],'#ffcf33','hide off']),`<div class="big" id="q"></div>${chip('🔊 Hear the question','#1e9bff','rq()')}<div class="say" id="ans" style="margin-top:12px"></div><div class="chips" id="o1" style="margin-top:12px"></div><div class="chips" id="o2" style="margin-top:12px"></div>`);
 ask()}

// 3 · Talk about Your Town
function a3(){
 H=()=>{};let th=-1,stem='',st='';window.M=[];
 const full=()=>stem&&st&&th>=0;
 const upd=()=>{$('#sen').textContent=`${stem||'…'} ${th>=0?TH[th][0]:'…'} in ${st||'…'}.`;$('#add').disabled=!full()};
 const pre=()=>{const ex=P[cur].l;
  $('#r1').innerHTML=TH.map((t,i)=>chip(`${t[1]} ${t[0]}`,['#ff5252','#8a5cf6','#ff4f9a','#3dbb4d'][i],`t3(${i})`)).join('');
  $('#r2').innerHTML=th>=0&&ex&&!stem?['There is a','There are'].map(s=>chip(s,'#ff8a2b',`s3('${s}')`)).join(''):'';
  $('#r3').innerHTML=stem?S3.map((s,i)=>chip(s,'#1e9bff',`g3(${i})`)).join('')+(ex?'<input id="ty" placeholder="…or type a street name" oninput="st3(this.value)" style="font:inherit;font-size:19px;padding:8px 12px;border-radius:14px;border:3px solid #1e9bff">':''):'';
  $('#who').innerHTML=`<span style="color:${P[cur].c}">${esc(P[cur].n)}</span>’s turn!`;upd()};
 window.t3=i=>{th=i;st='';stem=P[cur].l?'':TH[i][2];pre()};
 window.s3=s=>{if(s!=TH[th][2])return bad('#sen');stem=s;pre()};
 window.g3=i=>{st=S3[i];upd()};
 window.st3=v=>{st=v.trim();upd()};
 window.sp=()=>full()&&say(`${stem} ${TH[th][0]} in ${st}.`);
 window.add3=()=>{const t=TH[th],pl=t[2]=='There are',s=`${stem} ${t[0]} in ${st}.`,d=`Where ${pl?'are':'is'} the ${t[0]}? ${pl?'They’re':'It’s'} in ${st}.`;
  M.push([s,d]);say(s);star();th=-1;stem=st='';nxt();pre();
  $('#list').innerHTML=M.map((m,i)=>`<div class="item">📍 ${esc(m[0])} ${chip('🔊','#1e9bff',`say(M[${i}][0])`)} ${chip('💬','#8a5cf6',`say(M[${i}][1])`)}<br><small>💬 ${esc(m[1])}</small></div>`).join('');
  msg('✅ Now ask a friend! Tap 💬 to hear the question and answer.');if(M.length>=6)setTimeout(()=>fin('a3'),3500)};
 shell('3 · Talk about Your Town','🏘️ Build a sentence about <b>your town</b>. Example: <b>There are traffic lights in Scotland Road.</b>',null,`<div class="big" id="who"></div><div class="chips" id="r1"></div><div class="chips" id="r2" style="margin-top:10px"></div><div class="chips" id="r3" style="margin-top:10px"></div><div class="say" id="sen" style="margin:12px 0"></div>${chip('🔊 Listen','#1e9bff','sp()')} <button class="chip" id="add" style="background:#3dbb4d" onclick="add3()" disabled>➕ Add to my town</button><div id="list"></div>`);
 pre()}

// 4 · Find and Say
function a4(){
 const R=sh(C);let n=0,found=0;
 const draw=()=>{const c=R[n],ex=P[cur].l;
  $('#q').innerHTML=found?`The ${c[0]} ${c[1]} is …`:`<span style="color:${P[cur].c}">${esc(P[cur].n)}</span>: 🔍 Find the <b style="color:${c[0]}">${c[0]} ${c[1]}</b>!`;
  $('#o').innerHTML=found?sh([c[3],...sh([0,1,2,3].filter(i=>i!=c[3])).slice(0,ex?3:1)]).map(i=>chip(L[i],['#1e9bff','#ff8a2b','#ff4f9a','#8a5cf6'][i],`lc(${i})`)).join(''):''};
 const ask=()=>{found=0;document.querySelectorAll('.hs').forEach(h=>h.classList.remove('glow'));$('#q').classList.remove('ok');draw();say(`Find the ${R[n][0]} ${R[n][1]}!`)};
 H=id=>{const c=R[n];if(found)return;
  if(id!=c[2]){const o=C.find(x=>x[2]==id);bad('#q');msg(`That’s the ${o[0]} ${o[1]}. Find the ${c[0]} ${c[1]}!`);return say(`That's the ${o[0]} ${o[1]}`)}
  found=1;$('#h'+id).classList.add('glow');say('Yes! Where is it?');msg('👏 Found it! Where is it?');draw()};
 window.hint=()=>$('#h'+R[n][2]).classList.add('glow');
 window.rq=()=>say(found?`Where is the ${R[n][0]} ${R[n][1]}?`:`Find the ${R[n][0]} ${R[n][1]}!`);
 window.lc=i=>{const c=R[n];if(i!=c[3])return bad('#q');const t=`The ${c[0]} ${c[1]} is ${L[i]}.`;$('#q').textContent=t;$('#q').classList.add('ok');$('#o').innerHTML='';say(t);star();msg('✅ Super! Now you say it!');setTimeout(()=>{n++;nxt();n<R.length?ask():fin('a4')},3000)};
 shell('4 · Find and Say','🔍 <b>Find</b> the vehicle on the map. Then <b>say</b> where it is. Example: <b>The red car is in the car park.</b>',C.map(c=>[c[2],...O[c[2]],'#ffcf33','hide']),`<div class="say" id="q"></div><div class="chips" style="margin-top:12px">${chip('💡 Hint','#ff8a2b','hint()')} ${chip('🔊 Again','#1e9bff','rq()')}</div><div class="chips" id="o" style="margin-top:12px"></div>`);
 ask()}

bar();home();
</script></body></html>
